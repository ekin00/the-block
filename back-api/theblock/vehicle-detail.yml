info:
  name: Vehicle detail by id
  type: http
  seq: 6

http:
  method: GET
  url: "{{host}}/api/the-block/{{vehicle_id}}"
  headers:
    - name: X-User-Id
      value: "{{user_id}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });

        test("returns the requested vehicle", function() {
          expect(String(res.body.id)).to.equal(String(bru.getVar("vehicle_id")));
        });

        test("auction window is intact (auction_end - auction_start = 5 days)", function() {
          const FIVE_DAYS_MS = 5 * 24 * 60 * 60 * 1000;
          const windowMs = new Date(res.body.auction_end).getTime() - new Date(res.body.auction_start).getTime();
          expect(windowMs).to.equal(FIVE_DAYS_MS);
        });

settings:
  encodeUrl: true
